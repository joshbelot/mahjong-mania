name: MahjongMania
options:
  bundleIdPrefix: com.joshbelot
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  MahjongCore: { path: Packages/MahjongCore }
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"            # what testers see
    CURRENT_PROJECT_VERSION: "2"        # build number; tools/bump_build.sh increments it every upload
    # DEVELOPMENT_TEAM is NOT set here. The release script passes DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" to xcodebuild;
    # for on-device runs from Xcode, the owner picks their team once in Signing & Capabilities (it lives in the generated, git-ignored project).
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  MahjongMania:
    type: application
    platform: iOS
    sources: [App]
    dependencies: [{ package: MahjongCore }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshbelot.mahjongmania
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Mahjong Mania
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.board-games
    info:
      path: App/Info.plist                # GENERATED by XcodeGen from the properties below and git-ignored. Edit properties here, never the plist.
      properties:
        CFBundleDisplayName: Mahjong Mania
        LSApplicationCategoryType: public.app-category.board-games
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: { UIColorName: LaunchBackground }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true          # portrait only: App Store validation otherwise demands all four orientations for iPad multitasking
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
        CFBundleURLTypes:                   # mahjongmania://card?... opens a shared card (SPEC §17.7); needs no permission
          - CFBundleURLName: com.joshbelot.mahjongmania
            CFBundleURLSchemes: [mahjongmania]
  MahjongManiaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies: [{ target: MahjongMania }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joshbelot.mahjongmania.tests
  MahjongManiaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies: [{ target: MahjongMania }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joshbelot.mahjongmania.uitests
schemes:
  MahjongMania:
    build: { targets: { MahjongMania: all } }
    test: { targets: [MahjongManiaTests, MahjongManiaUITests], gatherCoverageData: true }
    archive: { config: Release }
